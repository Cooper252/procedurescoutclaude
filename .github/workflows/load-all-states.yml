name: Load every state into the live site

# The same steps as "Load a state into the live site" (load-state-production.yml;
# keep the two in step), for every state one after another, so nobody has to
# start 51 runs. Each state is its own job (up to 6 hours); a state that hits
# the 4.5-hour price-file limit is finished by the next run (finished
# hospitals are skipped). Runs by hand, and on the 1st of each month to pick
# up hospitals' new price files (offices are not reloaded then).

on:
  workflow_dispatch:
    inputs:
      states:
        description: "all, or a list such as AZ,CA,TX"
        required: true
        default: "all"
      download_price_files:
        description: "Download, check and publish each state's hospital price files"
        type: boolean
        default: true
      first_files_automatic:
        description: "Publish a hospital's FIRST file automatically when every check passes (D-055)"
        type: boolean
        default: true
      load_offices:
        description: "Load offices from the national provider list (about 1.1 GB download per state)"
        type: boolean
        default: true
      nppes_url:
        description: "NPPES monthly file (see download.cms.gov/nppes/NPI_Files.html)"
        required: false
        default: "https://download.cms.gov/nppes/NPPES_Data_Dissemination_November_2026_V2.zip"
      nucc_url:
        description: "NUCC taxonomy CSV (see nucc.org)"
        required: false
        default: "https://www.nucc.org/images/stories/CSV/nucc_taxonomy_261.csv"
  schedule:
    - cron: "23 7 1 * *"  # 07:23 UTC on the 1st of each month

permissions:
  contents: read

concurrency:
  group: production-load  # never at the same time as a single-state load
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      states: ${{ steps.pick.outputs.states }}
    steps:
      - id: pick
        env:
          STATES_IN: ${{ inputs.states || 'all' }}
        run: |
          ALL="AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY"
          IN=$(printf '%s' "$STATES_IN" | tr '[:lower:]' '[:upper:]' | tr -c 'A-Z\n' ' ')
          if [ "$(echo $IN)" = "ALL" ]; then IN="$ALL"; fi
          OUT=""
          for s in $IN; do case " $ALL " in *" $s "*) OUT="$OUT\"$s\",";; esac; done
          echo "states=[${OUT%,}]" >> "$GITHUB_OUTPUT"
          echo "states=[${OUT%,}]"

  load:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    services:
      # D-059: a throwaway database on this computer holds each file's price
      # rows while it is checked and published; the live database gets only
      # the results, so it never fills up.
      work:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 20
    strategy:
      fail-fast: false  # one state's trouble never stops the others
      max-parallel: 1   # one state at a time: the live database is small
      matrix:
        state: ${{ fromJSON(needs.plan.outputs.states) }}
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      PRICE_STORE_DIR: ${{ secrets.PRICE_STORE_DIR }}
      PRICE_STORE_ENDPOINT: ${{ secrets.PRICE_STORE_ENDPOINT }}
      PRICE_STORE_KEY_ID: ${{ secrets.PRICE_STORE_KEY_ID }}
      PRICE_STORE_SECRET: ${{ secrets.PRICE_STORE_SECRET }}
      PYTHONPATH: packages/core:packages/ingest
      WORK_DATABASE_URL: postgresql+psycopg://ps_owner:ps_owner_dev@localhost:5432/procedurescout
      STATE_IN: ${{ matrix.state }}
    steps:
      - name: Stop if hosting is not set up
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PRICE_STORE_DIR" ]; then
            echo "Live database or R2 secrets are missing; set them up first (docs/DEPLOYMENT_PLAN.md)."
            exit 1
          fi
      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Stop if the live database is not on the newest version
        run: |
          python - <<'PY'
          import os, sys
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text
          from procedurescout_core.db_url import sqlalchemy_url
          head = ScriptDirectory.from_config(Config("alembic.ini")).get_current_head()
          with create_engine(sqlalchemy_url(os.environ["DATABASE_URL"])).connect() as c:
              now = c.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
          print(f"live database at {now}, code expects {head}")
          # a newer database is fine (the site was updated during a long run;
          # changes only ever add); an older one means the API wasn't deployed
          sys.exit(0 if int(now) >= int(head) else "deploy the API first (it upgrades the database), then run this again")
          PY
      - name: Set up the work database on this computer
        env:
          PGPASSWORD: postgres_ci_only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/db_init.sql
          DATABASE_URL="$WORK_DATABASE_URL" python -m alembic upgrade head
          python -m procedurescout_ingest.reference.cli prepare-work-db
      - name: Load reference data, websites, price files (publish as they pass)
        env:
          PRICE_FILE_DOWNLOADS: ${{ (github.event_name == 'schedule' || inputs.download_price_files) && '1' || '0' }}
          PRICE_LOAD: ${{ (github.event_name == 'schedule' || inputs.download_price_files) && '1' || '0' }}
          PUBLISH_AS_YOU_GO: "1"
          AUTO_PUBLISH_FIRST_FILES: ${{ (github.event_name == 'schedule' || inputs.first_files_automatic) && '1' || '0' }}
          # Stop reading price files after 4 hours so the run finishes inside
          # GitHub's 6-hour limit; run the state again to carry on (finished
          # hospitals are skipped).
          PRICE_TIME_BUDGET_MINUTES: "240"
        run: |
          set -o pipefail
          STATE=$(printf '%s' "$STATE_IN" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z' | cut -c1-2)
          python -m procedurescout_ingest.reference.cli nv-all --state "$STATE" | tee load-report.txt
      - name: Load offices from the national provider list
        if: ${{ github.event_name != 'schedule' && inputs.load_offices }}
        env:
          NPPES_URL: ${{ inputs.nppes_url }}
          NUCC_URL: ${{ inputs.nucc_url }}
        run: |
          STATE=$(printf '%s' "$STATE_IN" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z' | cut -c1-2)
          python -m procedurescout_ingest.reference.cli nppes-offices --file "$NPPES_URL" --nucc "$NUCC_URL" --state "$STATE"
          python -m procedurescout_ingest.reference.cli geocode --state "$STATE"
      - name: Refresh code index, insurance names and clean up
        if: always()
        run: |
          python -m procedurescout_ingest.reference.cli resolve-plans || true
          python -m procedurescout_ingest.reference.cli code-index
          python -m procedurescout_ingest.reference.cli prune-published
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-${{ matrix.state }}
          path: load-report.txt
          if-no-files-found: ignore
