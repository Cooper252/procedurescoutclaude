name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ps_owner:ps_owner_dev@localhost:5432/procedurescout_test
      TEST_API_DATABASE_URL: postgresql+psycopg://ps_api:ps_api_dev@localhost:5432/procedurescout_test
      PS_API_ROLE: ps_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Create roles and databases
        env:
          PGPASSWORD: postgres_ci_only
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/db_init.sql
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest

  # The website: type check, "What will I pay?" math tests and a full build in
  # live mode (2026-11-12: website changes were never checked before deploying).
  website:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Build (live mode; no API is reachable here, so pages build empty)
        env:
          API_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SITE_URL: https://procedurescout.com
        run: npm run build
