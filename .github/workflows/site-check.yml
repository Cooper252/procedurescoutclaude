name: Live site check (every 15 minutes)

# Free uptime alert (go-live check, 2026-11-12): opens the live site, a real
# search and the API health check. If any fails or is slow, this run fails and
# GitHub emails the repository owner. Nothing is changed on the site.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Home page
        run: curl -fsS --max-time 20 -o /dev/null https://procedurescout.com/
      - name: API health
        run: curl -fsS --max-time 20 https://procedurescout.com/api/healthz | grep -q '"ok"'
      - name: A real search answers within 15 seconds and finds prices
        run: |
          body=$(curl -fsS --max-time 15 "https://procedurescout.com/api/v1/search?lat=36.17&lng=-115.18&service=mri-brain-without-contrast")
          echo "$body" | grep -q '"status":"prices"'
      - name: Sign-in page
        run: curl -fsS --max-time 20 -o /dev/null https://procedurescout.com/providers/sign-in
